name: Android CI

on:
  # Build every maintained development line so APKs cannot silently come from stale source.
  push:
    branches:
      - main
      - 'fix/**'
      - 'ui/**'
      - 'perf/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          # Install native tools because app/build.gradle.kts compiles the C++ audio engine.
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download CC0 DirectWave factory samples
        shell: bash
        run: |
          set -euo pipefail
          target="app/src/main/assets/samples"
          mkdir -p "$target"
          base="https://raw.githubusercontent.com/Boochi44/free-drum-samples/main/drum-samples"
          curl --fail --location --retry 3 "$base/01-hard-trap/kicks/hard-kick-01.wav" -o "$target/hard-kick-01.wav"
          curl --fail --location --retry 3 "$base/01-hard-trap/snares/hard-snare-01.wav" -o "$target/hard-snare-01.wav"
          curl --fail --location --retry 3 "$base/01-hard-trap/hi-hats/hi-hat-closed-01.wav" -o "$target/hi-hat-closed-01.wav"
          curl --fail --location --retry 3 "$base/01-hard-trap/808s/808-bass-sub.wav" -o "$target/808-bass-sub.wav"
          curl --fail --location --retry 3 "$base/02-bounce/kicks/bounce-kick-01.wav" -o "$target/bounce-kick-01.wav"
          curl --fail --location --retry 3 "$base/03-soulful-vintage/kicks/vintage-kick-01.wav" -o "$target/vintage-kick-01.wav"
          test "$(find "$target" -maxdepth 1 -name '*.wav' | wc -l)" -eq 6
          for sample in "$target"/*.wav; do test "$(od -An -tx1 -N4 "$sample" | tr -d ' \n')" = "52494646"; done
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioWave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
